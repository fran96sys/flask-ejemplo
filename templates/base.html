<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f8fc">
    <title>{% block title %}Aula Abierta{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <header class="site-header">
        <nav class="nav container" aria-label="Navegación principal">
            <a class="brand" href="{{ url_for('inicio') }}"><span class="brand-mark">A</span><span>Aula Abierta</span></a>
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav-links">Menú</button>
            <div class="nav-links" id="nav-links">
                <a href="{{ url_for('inicio') }}">Inicio</a>
                <a href="{{ url_for('estudiantes') }}">Estudiantes</a>
                <a href="{{ url_for('contacto') }}">Contacto</a>
            </div>
        </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer class="site-footer"><div class="container footer-inner"><span>Aula Abierta</span><span>Un espacio para aprender y crecer.</span></div></footer>
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
